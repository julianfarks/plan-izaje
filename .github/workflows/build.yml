name: Compilar APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'magnificos/**'
      - '.github/workflows/build-magnificos.yml'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Pruebas del núcleo de cálculo
        run: gradle :core:test --no-daemon --stacktrace

      - name: Pruebas unitarias de la app
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Compilar APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/release/app-release.apk salida/PlanIzaje-1.0.${{ github.run_number }}.apk
          ls -la salida

      - name: Informe de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-pruebas
          path: core/build/reports/tests/

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PlanIzaje 1.0.${{ github.run_number }}
          body: |
            APK de PlanIzaje compilado automáticamente desde `${{ github.sha }}`.
            Descarga el archivo .apk de abajo e instálalo en tu Android.
          files: salida/PlanIzaje-1.0.${{ github.run_number }}.apk
          make_latest: true

  pruebas-dispositivo:
    name: Pruebas en emulador Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Ejecutar pruebas instrumentadas (recorrido de usuario y PDF)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest --no-daemon -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true > salida-emulador.txt 2>&1 || (adb logcat -d -s OCR_PLANIZAJE:I > ocr.txt; adb exec-out run-as co.planizaje.app tar c -C files ocr > ocr.tar; mkdir -p ocr-dump; tar xf ocr.tar -C ocr-dump; tail -c 20000 salida-emulador.txt; exit 1)
            adb logcat -d -s OCR_PLANIZAJE:I > ocr.txt
            adb exec-out run-as co.planizaje.app tar c -C files ocr > ocr.tar; mkdir -p ocr-dump; tar xf ocr.tar -C ocr-dump || true; ls -la ocr-dump ocr-dump/* > ocr-ls.txt 2>&1 || true
      - name: Publicar volcado OCR en la rama datos-ocr
        if: always()
        run: |
          cat ocr-ls.txt 2>/dev/null | head -12 | while IFS= read -r l; do echo "::notice title=ocrls::$l"; done
          if [ -n "$(ls -A ocr-dump 2>/dev/null)" ]; then
            git config user.name "github-actions"; git config user.email "actions@github.com"
            git checkout --orphan datos-ocr-tmp
            git rm -rq --cached . || true
            git add -f ocr-dump
            git commit -qm "Volcado OCR ${{ github.run_number }}"
            git push -f origin HEAD:refs/heads/datos-ocr
          fi
      - name: Informe de lectura OCR de las placas reales
        if: always()
        run: |
          grep -h "OCR_PLANIZAJE" ocr.txt 2>/dev/null | sed 's/.*OCR_PLANIZAJE[^:]*: //' | while IFS= read -r l; do echo "::notice title=ocr::$l"; done || true
      - name: Publicar errores como anotaciones
        if: failure()
        run: |
          grep -hE -A20 "(Exception|Error)[:]" salida-emulador.txt | grep -vE '^\s+at (androidx|java|kotlin|org\.junit|android\.)' | head -45 | tr '\n' '~' | fold -w 900 | while IFS= read -r l; do echo "::error title=detalle::$l"; done
          grep -hE "FAILED|crash|Crash|tests on|Test run failed|Instrumentation" salida-emulador.txt | head -20 | tr '\n' '~' | fold -w 900 | while IFS= read -r l; do echo "::error title=resumen::$l"; done
          tail -c 2500 salida-emulador.txt | tr '\n' '~' | fold -w 900 | while IFS= read -r l; do echo "::error title=cola::$l"; done
          exit 0
      - name: Informe de pruebas en emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-emulador
          path: app/build/reports/androidTests/
