name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Pruebas del núcleo de cálculo
        run: gradle :core:test --no-daemon --stacktrace

      - name: Pruebas unitarias de la app
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Compilar APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/release/app-release.apk salida/PlanIzaje-1.0.${{ github.run_number }}.apk
          ls -la salida

      - name: Informe de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-pruebas
          path: core/build/reports/tests/

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PlanIzaje 1.0.${{ github.run_number }}
          body: |
            APK de PlanIzaje compilado automáticamente desde `${{ github.sha }}`.
            Descarga el archivo .apk de abajo e instálalo en tu Android.
          files: salida/PlanIzaje-1.0.${{ github.run_number }}.apk
          make_latest: true

  pruebas-dispositivo:
    name: Pruebas en emulador Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Ejecutar pruebas instrumentadas (recorrido de usuario y PDF)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --no-daemon > salida-emulador.txt 2>&1 || (tail -c 20000 salida-emulador.txt; exit 1)
      - name: Publicar errores como anotaciones
        if: failure()
        run: |
          grep -hA25 "AssertionError" salida-emulador.txt | grep -v '^\s*at ' | head -40 | tr '\n' '~' | fold -w 900 | while IFS= read -r l; do echo "::error title=detalle::$l"; done || true
          for f in $(find app/build/outputs/androidTest-results -name "*.xml" 2>/dev/null); do
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for tc in ET.parse(sys.argv[1]).iter('testcase'):
              for fl in list(tc.iter('failure')) + list(tc.iter('error')):
                  msg = (fl.get('message') or fl.text or '').replace('\n', ' | ')[:1500]
                  print(f"::error title={tc.get('name')}::{msg}")
          PY
          done
      - name: Informe de pruebas en emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-emulador
          path: app/build/reports/androidTests/
