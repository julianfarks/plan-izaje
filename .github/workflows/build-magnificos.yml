name: Compilar APK – Plan de Izaje Los Magníficos

on:
  push:
    branches: [ main, magnificos ]
    paths: [ 'magnificos/**', '.github/workflows/build-magnificos.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: magnificos
    env:
      GITHUB_RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Pruebas del núcleo de cálculo
        run: gradle :core:test --no-daemon --stacktrace

      - name: Compilar APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/release/app-release.apk salida/PlanIzaje-LosMagnificos-2.0.${{ github.run_number }}.apk
          ls -la salida

      - name: Informe de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-pruebas-magnificos
          path: magnificos/core/build/reports/tests/

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PlanIzaje-LosMagnificos-apk
          path: magnificos/salida/*.apk

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: magnificos-${{ github.run_number }}
          name: Plan de Izaje Los Magníficos 2.0.${{ github.run_number }}
          body: |
            APK de «Plan de Izaje Los Magníficos SAS» compilado automáticamente desde `${{ github.sha }}`.
            Descarga el archivo .apk de abajo e instálalo en tu Android.
          files: magnificos/salida/PlanIzaje-LosMagnificos-2.0.${{ github.run_number }}.apk
          make_latest: false
